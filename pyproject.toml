[project]
name = "wands-search"
version = "0.1.0"
description = "Search relevance system on Wayfair WANDS dataset"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "pyspark>=3.5",
    "google-cloud-bigquery>=3.20",
    "pandas-gbq>=0.23",
    "rank-bm25>=0.2",
    "sentence-transformers>=2.2",
    "faiss-cpu>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wands"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
